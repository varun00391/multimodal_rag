services:
  extraction:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      EXTRACTION_WORKSPACE: /app/output
      EXTRACTION_MODEL_CACHE: /app/models
    volumes:
      - ./output:/app/output
      - extraction_models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  extraction_models:
