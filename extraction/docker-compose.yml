services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-extractor-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      WORKER_MODE: external
      STORAGE_ROOT: /app/data
      DATABASE_URL: sqlite:////app/data/extractor.db
      TESSERACT_CMD: tesseract
    volumes:
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-extractor-worker
    env_file:
      - .env
    environment:
      WORKER_MODE: external
      STORAGE_ROOT: /app/data
      DATABASE_URL: sqlite:////app/data/extractor.db
      TESSERACT_CMD: tesseract
    volumes:
      - ./data:/app/data
    command: python -m app.workers.extraction_worker
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

