# FastAPI extraction service with PaddleOCR and Tesseract.
#
#   cp .env.example .env   # set EURI_API_KEY, or keep using the repo .env
#   docker compose up --build
#   open http://localhost:8000
#
# POST a PDF:
#   curl -F "file=@your.pdf" http://localhost:8000/extract
#
# CLI still works:
#   docker compose run --rm extract python main.py /app/inputs/your.pdf

services:
  extract:
    build:
      context: .
      dockerfile: Dockerfile
    image: extraction-testing:latest
    platform: linux/amd64
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - path: ../../.env
        required: false
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      TESSERACT_CMD: tesseract
    volumes:
      - .:/app
      - paddleocr-cache:/root/.paddleocr
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 300

volumes:
  paddleocr-cache:
