[project]
name = "extraction-service"
version = "0.1.0"
description = "Multimodal document extraction service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "xlrd>=2.0",
    "openai>=1.50",
    "httpx>=0.27",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
media = [
    "paddleocr>=2.9",
    "paddlepaddle>=2.6",
    "faster-whisper>=1.1",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
